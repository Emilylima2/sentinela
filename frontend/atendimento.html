<!DOCTYPE html>
<html>
<head><link rel="stylesheet" href="css/style.css"></head>
<body>
<div class="container">
<h2>Atendimento</h2>

<input id="nome" placeholder="Nome">
<input id="cpf" placeholder="CPF">
<input id="data de nascimento" placeholder="data de nascimento">
  <input id="Nome da mae" placeholder="nome da mãe">
   <input id="endereco" placeholder="endereço">
   <input id="telefone" placeholder="telefone">
   <input id="email" placeholder="e-mail">
   <input id="contato de emergencia" placeholder="contato de emergnecia">
<select id="tipo">
  <option>Convenio</option>
  <option>Particular</option>

</select>
  
<select id="sexo">
  <option>Feminino</option>
  <option>Masculino</option>

</select>
  
  <select id="estado civil">
  <option>casado(a)</option>
  <option>solteiro(a)</option>
  <option>viuvo(a)</option>
  <option>divorciado(a)</option>

</select>

<input type="file" id="foto">

<button onclick="cadastrar()">Cadastrar</button>
</div>

<script>
function cadastrar(){
 fetch("http://localhost:3000/atendimento",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body: JSON.stringify({
    nome: nome.value,
    cpf: cpf.value,
    datadenascimento: datadenascimento.value,
    nomedamae: nomedamae.value,
    endereço: endereco.value,
    telefone: telefone.value,
    email: email.value,
    contatodeemergencia: contatodeemergencia.value,
    tipo: tipo.value,
    sexo: sexo.value,
    estadocivil: estadocivil.value
  })
 });
 alert("Paciente enviado para triagem");
}
</script>
</body>
</html>
