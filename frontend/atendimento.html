<!DOCTYPE html>
<html>
<head><link rel="stylesheet" href="css/style.css"></head>
<body>
<div class="container">
<h2>Atendimento</h2>

<input id="nome" placeholder="Nome">
<input id="cpf" placeholder="CPF">
<input id="datadenascimento" placeholder="data de nascimento">
  <input id="nomedamae" placeholder="nome da mãe">
   <input id="endereco" placeholder="endereço">
   <input id="telefone" placeholder="telefone">
   <input id="email" placeholder="e-mail">
   <input id="contatodeemergencia" placeholder="contato de emergnecia">
<select id="tipo">
  <option>Convenio</option>
  <option>Particular</option>
 
</select>
  
<select id="sexo">
  <option>Feminino</option>
  <option>Masculino</option>

</select>
  
  <select id="estadocivil">
  <option>casado(a)</option>
  <option>solteiro(a)</option>
  <option>viuvo(a)</option>
  <option>divorciado(a)</option>

</select>

<input type="file" id="foto">
<button onclick="cadastrar()">Cadastrar</button>
</div>

<script>
function cadastrar(){
    alert("Botão funcionando!");
 fetch("http://localhost:3000/atendimento",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body: JSON.stringify({
   nome: document.getElementById('nome').value,
    cpf: document.getElementById('cpf').value,
    datadenascimento: document.getElementById('datadenascimento').value,
    nomedamae: document.getElementById('nomedamae').value,
    endereco: document.getElementById('endereco').value,
    telefone: document.getElementById('telefone').value,
    email: document.getElementById('email').value,
    contatodeemergencia: document.getElementById('contatodeemergencia').value,
    tipo: document.getElementById('tipo').value,
    sexo: document.getElementById('sexo').value,
    estadocivil: document.getElementById('estadocivil').value

  })
 });
 alert("Paciente enviado para triagem");
}
</script>
</body>
</html>
