<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Alta Médica</title>

  <link rel="stylesheet"
        href="css/style.css">

  <style>

    body {
      background: #f4f6f9;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 1000px;
      margin: auto;
    }

    .card-alta {
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.10);
    }

    h1 {
      color: #1f4e79;
      margin-bottom: 5px;
    }

    .subtitulo {
      color: #666;
      margin-bottom: 25px;
    }

    .secao {
      margin-top: 25px;
      padding-top: 20px;
      border-top: 1px solid #ddd;
    }

    .secao h2 {
      color: #1f4e79;
      font-size: 20px;
      margin-bottom: 15px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .campo {
      display: flex;
      flex-direction: column;
    }

    .campo-completo {
      grid-column: 1 / -1;
    }

    label {
      font-weight: bold;
      margin-bottom: 6px;
      color: #333;
    }

    input,
    select,
    textarea {

      padding: 10px;

      border: 1px solid #ccc;

      border-radius: 5px;

      font-size: 15px;

      box-sizing: border-box;

      width: 100%;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    input:focus,
    select:focus,
    textarea:focus {

      outline: none;

      border-color: #1f4e79;
    }

    /*
     * Paciente selecionado
     */

    #paciente {

      background: #eef6ff;

      border: 2px solid #1f4e79;

      font-weight: bold;

      color: #1f4e79;

    }

    .botoes {

      display: flex;

      gap: 10px;

      flex-wrap: wrap;

      margin-top: 30px;
    }

    button {

      border: none;

      padding: 11px 18px;

      border-radius: 6px;

      cursor: pointer;

      font-weight: bold;

      font-size: 14px;
    }

    .btn-salvar {

      background: #28a745;

      color: white;
    }

    .btn-salvar:hover {

      background: #218838;
    }

    .btn-pdf {

      background: #dc3545;

      color: white;
    }

    .btn-pdf:hover {

      background: #bd2130;
    }

    .btn-voltar {

      background: #6c757d;

      color: white;
    }

    .btn-voltar:hover {

      background: #545b62;
    }

    .obrigatorio {
      color: red;
    }

    .rodape-impressao {
      display: none;
    }

    @media (max-width: 700px) {

      .form-grid {
        grid-template-columns: 1fr;
      }

      .campo-completo {
        grid-column: auto;
      }

    }

    @media print {

      body {

        background: white;

        padding: 0;
      }

      .card-alta {

        box-shadow: none;

        padding: 0;
      }

      .botoes,
      .nao-imprimir {

        display: none !important;
      }

      input,
      select,
      textarea {

        border: none;

        border-bottom: 1px solid #999;

        border-radius: 0;

        padding-left: 0;

      }

      /*
       * O nome do paciente continua aparecendo
       * no PDF mesmo sendo readonly.
       */

      #paciente {

        background: white;

        border: none;

        border-bottom: 1px solid #999;

      }

      .rodape-impressao {

        display: block;

        margin-top: 60px;
      }

    }

  </style>

</head>

<body>

<div class="container">

  <div class="card-alta">

    <h1>🏥 Alta Médica</h1>

    <p class="subtitulo">
      Formulário de alta e orientações ao paciente
    </p>


    <!-- DADOS DO PACIENTE -->

    <div class="secao">

      <h2>1. Dados do Paciente</h2>

      <div class="form-grid">

        <div class="campo">

          <label>
            Nome do paciente
            <span class="obrigatorio">*</span>
          </label>

          <input
            type="text"
            id="paciente"
            placeholder="Nome completo"
            readonly
            required>

        </div>


        <div class="campo">

          <label>
            Data de nascimento
          </label>

          <input
            type="date"
            id="dataNascimento">

        </div>


        <div class="campo">

          <label>CPF</label>

          <input
            type="text"
            id="cpf"
            placeholder="000.000.000-00">

        </div>


        <div class="campo">

          <label>Cartão SUS</label>

          <input
            type="text"
            id="cartaoSus"
            placeholder="Número do cartão SUS">

        </div>


        <div class="campo">

          <label>Telefone</label>

          <input
            type="text"
            id="telefone"
            placeholder="(00) 00000-0000">

        </div>


        <div class="campo">

          <label>
            Data da alta
            <span class="obrigatorio">*</span>
          </label>

          <input
            type="date"
            id="dataAlta"
            required>

        </div>


        <div class="campo">

          <label>Hora da alta</label>

          <input
            type="time"
            id="horaAlta">

        </div>


        <div class="campo">

          <label>Tipo de alta</label>

          <select id="tipoAlta">

            <option value="">
              Selecione
            </option>

            <option value="Alta médica">
              Alta médica
            </option>

            <option value="Alta administrativa">
              Alta administrativa
            </option>

            <option value="Alta a pedido">
              Alta a pedido
            </option>

            <option value="Transferência">
              Transferência
            </option>

            <option value="Evasão">
              Evasão
            </option>

          </select>

        </div>

      </div>

    </div>


    <!-- INFORMAÇÕES CLÍNICAS -->

    <div class="secao">

      <h2>2. Informações Clínicas</h2>

      <div class="form-grid">

        <div class="campo campo-completo">

          <label>
            Diagnóstico principal
          </label>

          <textarea
            id="diagnostico"
            placeholder="Informe o diagnóstico principal"></textarea>

        </div>


        <div class="campo campo-completo">

          <label>
            Diagnósticos secundários
          </label>

          <textarea
            id="diagnosticosSecundarios"
            placeholder="Outros diagnósticos, se houver"></textarea>

        </div>


        <div class="campo campo-completo">

          <label>
            Resumo do atendimento
          </label>

          <textarea
            id="resumoAtendimento"
            placeholder="Descreva resumidamente o atendimento realizado, evolução do paciente e principais informações clínicas"></textarea>

        </div>


        <div class="campo campo-completo">

          <label>
            Condição do paciente no momento da alta
          </label>

          <textarea
            id="condicaoAlta"
            placeholder="Descreva a condição clínica do paciente no momento da alta"></textarea>

        </div>

      </div>

    </div>


    <!-- MEDICAÇÕES -->

    <div class="secao">

      <h2>3. Medicações e Tratamento</h2>

      <div class="form-grid">

        <div class="campo campo-completo">

          <label>
            Medicações prescritas na alta
          </label>
