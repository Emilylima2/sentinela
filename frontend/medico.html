<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Painel Médico</title>

  <link rel="stylesheet" href="css/style.css">

  <style>

    :root {
      --azul-escuro: #0b2d4d;
      --azul: #1261a0;
      --azul-medio: #1e88d8;
      --azul-claro: #eaf5ff;
      --azul-hover: #0d4f85;
      --branco: #ffffff;
      --cinza: #667085;
      --borda: #cfe2f3;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #eaf5ff, #dceeff);
      margin: 0;
      padding: 30px 15px;
      color: #243447;
    }

    .container {
      width: 90%;
      max-width: 1000px;
      margin: 20px auto;
      background: var(--branco);
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 8px 25px rgba(11, 45, 77, 0.12);
      border: 1px solid var(--borda);
    }

    .cabecalho {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 2px solid #e0effc;
      padding-bottom: 18px;
    }

    .cabecalho h2 {
      margin: 0;
      color: var(--azul-escuro);
      font-size: 26px;
    }

    .btn-abrir-tv {
      background: var(--azul);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-abrir-tv:hover {
      background: var(--azul-hover);
      transform: translateY(-1px);
    }

    .consultorio-input {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      background: var(--azul-claro);
      padding: 14px 16px;
      border-radius: 10px;
      border: 1px solid var(--borda);
    }

    .consultorio-input label {
      font-weight: bold;
      color: var(--azul-escuro);
    }

    .consultorio-input input {
      width: 60px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      padding: 6px 8px;
      border: 1px solid #a9cce8;
      border-radius: 6px;
      color: var(--azul-escuro);
      background: white;
    }

    h3 {
      color: var(--azul-escuro);
    }

    #paciente,
    #diagnostico,
    #medicacao,
    #obs {

      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid #c9ddec;
      border-radius: 8px;
      font-size: 15px;
      background: #fafdff;
      color: #243447;
      transition: 0.2s;
    }

    #paciente:focus,
    #diagnostico:focus,
    #medicacao:focus,
    #obs:focus {
      outline: none;
      border-color: var(--azul-medio);
      box-shadow: 0 0 0 3px rgba(30, 136, 216, 0.12);
    }

    #obs {
      min-height: 100px;
      resize: vertical;
    }

    button {
      background: var(--azul);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      transition: 0.2s;
    }

    button:hover {
      background: var(--azul-hover);
      transform: translateY(-1px);
    }

    .btn-tv {
      background: #1976c5;
    }

    .btn-tv:hover {
      background: #0b4f83;
    }

    .btn-alta {
      background: #1261a0;
    }

    .btn-alta:hover {
      background: #0b416d;
    }

    .card {
      background: #fafdff;
      border: 1px solid var(--borda);
      border-left: 5px solid var(--azul);
      border-radius: 10px;
      padding: 18px;
      margin-bottom: 15px;
      box-shadow: 0 4px 12px rgba(11, 45, 77, 0.08);
      transition: 0.2s;
    }

    .card:hover {
      box-shadow: 0 6px 18px rgba(11, 45, 77, 0.13);
      transform: translateY(-2px);
    }

    .card h3 {
      margin-top: 0;
      color: var(--azul-escuro);
    }

    hr {
      border: none;
      border-top: 1px solid #dcebf7;
      margin: 25px 0;
    }

    .alto {
      background: #ffe5e5;
      color: #b42318;
      padding: 5px 9px;
      border-radius: 5px;
      font-weight: bold;
    }

    .medio {
      background: #fff4d6;
      color: #946200;
      padding: 5px 9px;
      border-radius: 5px;
      font-weight: bold;
    }

    .baixo {
      background: #e2f7e8;
      color: #147a36;
      padding: 5px 9px;
      border-radius: 5px;
      font-weight: bold;
    }

    .painel-pdf {
      text-align: center;
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid #dcebf7;
    }

    .painel-pdf p {
      color: var(--cinza);
    }

    @media (max-width: 700px) {

      .cabecalho {
        flex-direction: column;
        gap: 15px;
        align-items: stretch;
      }

      .btn-abrir-tv {
        width: 100%;
      }

      .consultorio-input {
        flex-wrap: wrap;
      }

      .container {
        width: 95%;
        padding: 18px;
      }
    }

    @media print {

      body {
        background: white;
      }

      .btn-abrir-tv,
      .btn-tv,
      .btn-alta,
      .btn-pdf,
      .consultorio-input {
        display: none;
      }

      .container {
        box-shadow: none;
        border: none;
      }
    }

  </style>
</head>

<body>

<div class="container">

  <div class="cabecalho">

    <h2>🩺 Painel Médico</h2>

    <button
      class="btn-abrir-tv"
      onclick="window.open('tv.html', '_blank')">

      📺 Abrir Tela da TV

    </button>

  </div>


  <div class="consultorio-input">

    <label>Meu Consultório:</label>

    <input
      type="text"
      id="consultorio-num"
      value="01">

    <span style="color:#667085; font-size:13px;">
      Este número será exibido na TV ao chamar o paciente.
    </span>

  </div>


  <h3>👨‍⚕️ Pacientes na fila</h3>

  <div id="triagens"></div>


  <hr>


  <h3>📋 Consulta</h3>

  <input
    id="paciente"
    placeholder="Paciente"
    readonly>

  <input
    id="diagnostico"
    placeholder="Diagnóstico">

  <select id="medicacao">

    <option value="">
      Selecione a medicação
    </option>

  </select>

  <textarea
    id="obs"
    placeholder="Observações"></textarea>

  <button onclick="salvar()">
    💾 Salvar Consulta
  </button>


  <div class="painel-pdf">

    <p>
      Gere uma versão para impressão ou PDF do painel.
    </p>

    <button
      class="btn-pdf"
      onclick="window.print()">

      📄 Gerar PDF

    </button>

  </div>

</div>


<script>

let triagensCarregadas = [];


/* ==============================
   CARREGAR TRIAGENS
================================ */

function carregar() {

  fetch("/triagens")

    .then(r => r.json())

    .then(data => {

      triagensCarregadas = data;

      const div =
        document.getElementById("triagens");

      div.innerHTML = "";


      if (data.length === 0) {

        div.innerHTML =
          "<p style='color:#888; text-align:center;'>Nenhum paciente na fila.</p>";

        return;
      }


      data.forEach((t, index) => {

        div.innerHTML += `

          <div class="card">

            <h3>👤 ${t.nome}</h3>

            <p>
              <b>Sintoma:</b>
              ${t.sintoma || "Não informado"}
            </p>

            <p>
              <b>Temperatura:</b>
              ${t.temperatura || "Não informada"}°C
            </p>

            <p>
              <span class="${t.risco || ""}">
                ${t.risco || "Não informado"}
              </span>
            </p>

            <p>
              <b>Alergia:</b>
              ${t.alergia || "Nenhuma"}
            </p>

            <p>
              <b>Observação:</b>
              ${t.observacao || "Nenhuma"}
            </p>

            <div style="display:flex; gap:8px; flex-wrap:wrap;">

              <button onclick="selecionar(${index})">
                👨‍⚕️ Atender
              </button>

              <button
                class="btn-tv"
                onclick="chamarNaTV(${index})">

                📺 Chamar na TV

              </button>

              <button
                class="btn-alta"
                onclick="darAlta(${index})">

                🏠 Dar Alta

              </button>

            </div>

          </div>

        `;

      });

    })

    .catch(error => {

      console.error(
        "Erro ao carregar triagens:",
        error
      );

    });

}


/* ==============================
   DAR ALTA
================================ */

function darAlta(index) {

  const paciente =
    triagensCarregadas[index];


  if (!paciente) {

    alert(
      "❌ Não foi possível encontrar o paciente."
    );

    return;
  }


  /*
   * Guarda SOMENTE o paciente selecionado.
   *
   * Isso não interfere na consulta médica.
   */

  sessionStorage.setItem(
    "pacienteAlta",
    JSON.stringify(paciente)
  );


  /*
   * Abre a página específica
   * da Alta Médica.
   */

  window.location.href =
    "alta.html";

}


/* ==============================
   CHAMAR NA TV
================================ */

function chamarNaTV(index) {

  const paciente =
    triagensCarregadas[index];

  if (!paciente) {
    return;
  }

  const consultorio =
    document.getElementById(
      "consultorio-num"
    ).value || "01";


  fetch("/tv/chamar", {

    method: "POST",

    headers: {
      "Content-Type": "application/json"
    },

    body: JSON.stringify({

      localTipo: "CONSULTÓRIO",

      localNumero: consultorio,

      paciente: paciente.nome

    })

  })

  .then(r => r.json())

  .then(() => {

    alert(
      "✅ " +
      paciente.nome +
      " foi chamado na TV para o Consultório " +
      consultorio +
      "!"
    );

  })

  .catch(error => {

    console.error(
      "Erro ao chamar paciente:",
      error
    );

    alert(
      "❌ Não foi possível chamar o paciente."
    );

  });

}


/* ==============================
   SELECIONAR PARA CONSULTA
================================ */

function selecionar(index) {

  const t =
    triagensCarregadas[index];


  document.getElementById("paciente").value =
    t.nome;


  document.getElementById("obs").value =
    t.observacao || "";


  if (
    t.alergia &&
    t.alergia !== "Nenhuma"
  ) {

    alert(
      "⚠️ Paciente possui alergia: " +
      t.alergia
    );

  }

}


/* ==============================
   MEDICAÇÕES
================================ */

function carregarMedicacoes() {

  fetch("/lista-medicacoes")

    .then(r => r.json())

    .then(data => {

      const select =
        document.getElementById("medicacao");


      select.innerHTML =
        `<option value="">
          Selecione a medicação
        </option>`;


      data.forEach(med => {

        const option =
          document.createElement("option");

        option.value = med;

        option.textContent = med;

        select.appendChild(option);

      });

    })

    .catch(error => {

      console.error(
        "Erro ao carregar medicações:",
        error
      );

    });

}


/* ==============================
   SALVAR CONSULTA
================================ */

function salvar() {

  const paciente =
    document.getElementById("paciente").value;

  const diagnostico =
    document.getElementById("diagnostico").value;

  const medicacao =
    document.getElementById("medicacao").value;

  const obs =
    document.getElementById("obs").value;


  if (!paciente) {

    alert(
      "Selecione um paciente clicando em Atender."
    );

    return;
  }


  if (!medicacao) {

    alert(
      "Selecione uma medicação."
    );

    return;
  }


  fetch("/consulta", {

    method: "POST",

    headers: {
      "Content-Type": "application/json"
    },

    body: JSON.stringify({

      paciente,
      diagnostico,
      medicacao,
      obs

    })

  })

  .then(r => r.json())

  .then(() => {

    alert(
      "✅ Consulta salva com sucesso!"
    );


    document.getElementById(
      "paciente"
    ).value = "";

    document.getElementById(
      "diagnostico"
    ).value = "";

    document.getElementById(
      "medicacao"
    ).value = "";

    document.getElementById(
      "obs"
    ).value = "";

  })

  .catch(error => {

    console.error(
      "Erro ao salvar consulta:",
      error
    );

    alert(
      "❌ Não foi possível salvar a consulta."
    );

  });

}


/* ==============================
   INICIALIZAÇÃO
================================ */

carregar();

carregarMedicacoes();

setInterval(
  carregar,
  10000
);

</script>

</body>
</html>
